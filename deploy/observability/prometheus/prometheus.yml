global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # SoundStage exposes Prometheus metrics on :9091/metrics (see config.metrics).
  # When the app runs on the host, use host.docker.internal; if you run the app
  # inside this compose network instead, replace with the service name.
  - job_name: 'soundstage'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          service: soundstage
