name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      - name: go test (benchmarks compile)
        run: go test -run='^$' -bench=. -benchtime=10x ./internal/ai/...

  ai-eval:
    name: AI Evaluation
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      EVAL_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run AI Evaluation
        run: |
          go test -run TestEvalAll ./internal/ai/evaluation/ -timeout 10m

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-metrics
          path: test_output/*.json
          retention-days: 7
