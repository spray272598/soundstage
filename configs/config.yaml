app:
  name: soundstage
  env: development
  version: 0.1.0

http:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 10s

websocket:
  addr: ":8081"
  read_timeout: 60s
  write_timeout: 10s
  max_message_size: 8192

mysql:
  dsn: "root:root@tcp(localhost:3306)/soundstage?charset=utf8mb4&parseTime=True&loc=Local"
  max_open: 25
  max_idle: 5

redis:
  addr: "localhost:6379"
  db: 0
  pool_size: 20

kafka:
  brokers:
    - "localhost:9092"
  topic_prefix: "soundstage."

asynq:
  redis_addr: "localhost:6379"

interaction:
  danmaku_rate_limit: 10
  danmaku_rate_window: 1s
  moderation_keywords:
    - "广告"
    - "spam"
    - "fuck"
  gift_idempotency_ttl: 24h

miclink:
  pk_duration: 5m
  pk_countdown_notice: 10s
  lock_ttl: 30s

metrics:
  addr: ":9091"
  path: "/metrics"

log:
  level: info
  format: json

ai:
  provider: openai
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  api_key: "" # set via env SOUNDSTAGE_AI_API_KEY
  mock_on_empty_key: true
  embedding_model: "text-embedding-3-small"
  embedding_base_url: "https://api.openai.com/v1"
  moderation_keywords:
    - "广告"
    - "spam"
  rag_top_k: 3
  agent_max_rounds: 8
  agent_timeout: 60s
