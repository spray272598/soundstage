services:
  mysql:
    image: mysql:8.0
    container_name: soundstage-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soundstage
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scripts/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: soundstage-pgvector
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soundstage
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soundstage-redis
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: soundstage-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: soundstage-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  prometheus:
    image: prom/prometheus:latest
    container_name: soundstage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: soundstage-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  minio:
    image: minio/minio:latest
    container_name: soundstage-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # MinIO bucket init (runs once and exits)
  minio-init:
    image: minio/mc:latest
    container_name: soundstage-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/soundstage || true;
      mc anonymous set download local/soundstage || true;
      exit 0;
      "
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: soundstage-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "50000"
    volumes:
      - jaeger_data:/go/bin/all-in-one-data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# Application service with profiles
  app:
    profiles: ["app", "dev"]
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: ${BUILD_TARGET:-app}
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: soundstage:local
    container_name: soundstage-app
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      jaeger:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9091:9091"
    environment:
      - SOUNDSTAGE_AI_API_KEY=${SOUNDSTAGE_AI_API_KEY:-}
      - SOUNDSTAGE_LOG_LEVEL=${SOUNDSTAGE_LOG_LEVEL:-info}
    volumes:
      - ../configs/config.docker.yaml:/app/configs/config.yaml:ro
      - app_data:/data
    restart: unless-stopped
    networks: [soundstage-net]

volumes:
  mysql_data:
  pgvector_data:
  redis_data:
  jaeger_data:
  app_data:
  minio_data:

networks:
  soundstage-net:
    driver: bridge
