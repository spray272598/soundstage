app:
  name: soundstage
  env: development
  version: 0.1.0

http:
  addr: ":8080"
  read_timeout: 10s
  # Generous write timeout: SSE agent runs can legitimately stream for up to
  # ai.agent_timeout (60s); this headroom prevents mid-stream connection cuts.
  write_timeout: 120s

websocket:
  addr: ":8081"
  read_timeout: 60s
  write_timeout: 10s
  max_message_size: 8192
  enable_compression: true
  read_buffer_size: 4096
  write_buffer_size: 4096

merger:
  # Number of merge workers for room messages (consistent hashing by room ID)
  worker_count: 4
  # Input channel buffer size
  channel_size: 1024
  # Maximum messages to batch before flushing
  max_batch_size: 100
  # Maximum time to wait before flushing partial batch
  max_delay: 10ms

tracing:
  # Enable distributed tracing
  enabled: true
  # Service name for tracing
  service_name: "soundstage"
  # OTLP HTTP endpoint (Jaeger collector)
  otlp_endpoint: "http://jaeger:4318"
  # Sampling rate (0.0 to 1.0)
  sampling_rate: 0.1
  # Disable TLS for OTLP connection
  insecure: true

mysql:
  dsn: "root:root@tcp(localhost:3306)/soundstage?charset=utf8mb4&parseTime=True&loc=Local"
  max_open: 25
  max_idle: 5
  max_lifetime: "5m"
  max_idle_time: "1m"

redis:
  addr: "localhost:6379"
  db: 0
  pool_size: 20
  # Note: maxmemory is configured in docker-compose.yml (512mb with allkeys-lru)
  # For production, set maxmemory in Redis config to prevent OOM

hub:
  # mode: "memory" (single instance) or "redis" (multi-gateway)
  mode: "memory"
  gateway_id: ""  # auto-generated if empty

kafka:
  brokers:
    - "localhost:9092"
  topic_prefix: "soundstage."
  consumer_count: 3  # Parallel consumers per topic

asynq:
  redis_addr: "localhost:6379"

interaction:
  danmaku_rate_limit: 10
  danmaku_rate_window: 1s
  moderation_keywords:
    - "广告"
    - "spam"
    - "fuck"
  gift_idempotency_ttl: 24h

miclink:
  pk_duration: 5m
  pk_countdown_notice: 10s
  lock_ttl: 30s

metrics:
  addr: ":9091"
  path: "/metrics"

log:
  level: info
  format: json

ai:
  provider: openai
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  api_key: "" # set via env SOUNDSTAGE_AI_API_KEY
  mock_on_empty_key: true
  embedding_model: "text-embedding-3-small"
  embedding_base_url: "https://api.openai.com/v1"
  vector_store:
    # type: "memory" (default), "pgvector", "qdrant"
    type: "memory"
    pgvector:
      dsn: "postgres://postgres:postgres@localhost:5432/soundstage?sslmode=disable"
      table_name: "ai_knowledge_base"
      vector_dims: 1536
      pool_size: 10
      hnsw_ef_search: 64
    qdrant:
      url: "http://localhost:6333"
      api_key: ""
      collection: "ai_knowledge_base"
      vector_dims: 1536
      timeout: 30
  moderation_keywords:
    - "广告"
    - "spam"
  rag_top_k: 3
  agent_max_rounds: 8
  agent_timeout: 60s

storage:
  # MinIO configuration for media storage
  minio:
    endpoint: "minio:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "soundstage"
    use_ssl: false
    region: "us-east-1"
